name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
          validate-wrappers: true

      - name: Install font test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Build and test
        if: runner.os != 'Windows'
        run: ./gradlew build --stacktrace --no-daemon --max-workers=2 --continue

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $socketDirectory = (New-Item -ItemType Directory -Force build/sockets).FullName
          $env:JAVA_TOOL_OPTIONS += ' "-Djdk.net.unixdomain.tmpdir=' + $socketDirectory + '"'
          .\gradlew.bat build --stacktrace --no-daemon --max-workers=2 --continue
          exit $LASTEXITCODE

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            opus-*/build/reports/tests/
            opus-*/build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JARs
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opus-jars
          path: opus-*/build/libs/*.jar
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

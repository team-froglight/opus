name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

env:
  ORG_GRADLE_PROJECT_ciBuildNumber: ${{ github.run_number }}
  ORG_GRADLE_PROJECT_ciBuildAttempt: ${{ github.run_attempt }}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Check out sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle and validate wrappers
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name == 'pull_request' || github.ref_name != github.event.repository.default_branch }}
          validate-wrappers: true

      - name: Install font test dependency
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes fonts-dejavu-core
          test -f /usr/share/fonts/truetype/dejavu/DejaVuSans.ttf

      - name: Build and test
        if: runner.os != 'Windows'
        run: ./gradlew build --stacktrace --no-daemon --max-workers=2 --continue

      - name: Build and test on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $socketDirectory = (New-Item -ItemType Directory -Force build/sockets).FullName
          $env:JAVA_TOOL_OPTIONS += ' "-Djdk.net.unixdomain.tmpdir=' + $socketDirectory + '"'
          .\gradlew.bat build --stacktrace --no-daemon --max-workers=2 --continue
          exit $LASTEXITCODE

      - name: Upload test reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            opus-*/build/reports/tests/
            opus-*/build/test-results/test/*.xml
          retention-days: 14
          if-no-files-found: warn

      - name: Upload JARs
        if: success() && runner.os == 'Linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: opus-jars
          path: opus-*/build/libs/*.jar
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  prerelease:
    name: Publish tested prerelease
    needs: build
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          validate-wrappers: true
      - name: Publish all library modules and catalog
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-daemon --max-workers=2 --stacktrace
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Download tested JARs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: opus-jars
          path: dist
      - name: Create numbered GitHub prerelease
        run: |
          tag="build-${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          mapfile -t jars < <(find dist -type f -name '*.jar' | sort)
          test "${#jars[@]}" -gt 0
          gh release create "$tag" "${jars[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Opus build ${GITHUB_RUN_NUMBER} (attempt ${GITHUB_RUN_ATTEMPT})" \
            --prerelease --latest=false --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
